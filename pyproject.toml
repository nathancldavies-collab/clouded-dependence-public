[project]
name = "clouded-dependence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "anthropic>=0.40",
    "matplotlib>=3.7",
    "jupyter>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clouded_deps"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
