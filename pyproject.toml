[project]
name = "clouded-dependence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "anthropic>=0.40",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "openpyxl>=3.1.5",
    "krippendorff>=0.8.2",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clouded_deps"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]

[tool.pytest.ini_options]
# run_pipeline.py lives at the repo root, not inside the package
pythonpath = ["."]
testpaths = ["tests"]
